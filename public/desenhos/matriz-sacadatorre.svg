<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Sacada com torre — Glass Code</title>
  <desc id="desc">Quatro painéis de vidro com pequenas fixações quadradas nas extremidades, pares de fixadores circulares nas uniões e uma torre de apoio inferior por painel.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F6F8F8"/>
      <stop offset="1" stop-color="#EAF1F3"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6F8F8"/>
      <stop offset=".55" stop-color="#DCE2E4"/>
      <stop offset="1" stop-color="#B6BEC1"/>
    </linearGradient>
  </defs>
  <!-- Vidros sem perfis superior ou inferior: contornos delicados, como na página de cálculo. -->
  <g fill="url(#glass)" stroke="#9AAAB1" stroke-width="1.2">
    <rect x="35" y="26" width="162" height="198"/>
    <rect x="197" y="26" width="162" height="198"/>
    <rect x="359" y="26" width="162" height="198"/>
    <rect x="521" y="26" width="162" height="198"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="8" opacity=".23" fill="none">
    <path d="M64 164 l68 -104 M226 164 l68 -104 M388 164 l68 -104 M550 164 l68 -104"/>
  </g>
  <!-- Fixações de ponta: dois quadrados rigorosamente iguais e alinhados. -->
  <g fill="#FFFFFF" stroke="#9AAAB1" stroke-width="1.2">
    <rect x="37" y="61" width="11" height="11" rx=".8"/>
    <rect x="670" y="61" width="11" height="11" rx=".8"/>
    <!-- Fixações vidro/vidro: pares de círculos na mesma altura e distância. -->
    <circle cx="186" cy="66.5" r="3.2"/>
    <circle cx="208" cy="66.5" r="3.2"/>
    <circle cx="348" cy="66.5" r="3.2"/>
    <circle cx="370" cy="66.5" r="3.2"/>
    <circle cx="510" cy="66.5" r="3.2"/>
    <circle cx="532" cy="66.5" r="3.2"/>
  </g>
  <!-- Torres inferiores: uma por vidro, com leve folga abaixo dos painéis. -->
  <g fill="url(#metal)" stroke="#8F9AA1" stroke-width="1">
    <rect x="109" y="182" width="14" height="52" rx="2"/>
    <rect x="106" y="232" width="20" height="4" rx="1"/>
    <rect x="271" y="182" width="14" height="52" rx="2"/>
    <rect x="268" y="232" width="20" height="4" rx="1"/>
    <rect x="433" y="182" width="14" height="52" rx="2"/>
    <rect x="430" y="232" width="20" height="4" rx="1"/>
    <rect x="595" y="182" width="14" height="52" rx="2"/>
    <rect x="592" y="232" width="20" height="4" rx="1"/>
  </g>
</svg>
