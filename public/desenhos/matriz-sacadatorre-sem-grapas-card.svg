<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Sacada com torre sem grapas</title>
  <desc id="desc">Quatro painéis de vidro sem grapas laterais nem furação nas junções, com quatro torres inferiores.</desc>
  <!-- Mesmo padrão técnico do card Sacada com Torre, sem grapas e sem furos. -->
  <g fill="#F5F8F9" stroke="#9AAAB1" stroke-width="1.45" stroke-linejoin="round">
    <rect x="20.5" y="15.5" width="79.5" height="99"/>
    <rect x="100" y="15.5" width="79.5" height="99"/>
    <rect x="179.5" y="15.5" width="79.5" height="99"/>
    <rect x="259" y="15.5" width="79.5" height="99"/>
  </g>
  <!-- Reflexos sutis, sem filtros ou degradês que provoquem aspecto borrado. -->
  <g stroke="#FFFFFF" stroke-width="2" opacity=".72" stroke-linecap="round">
    <path d="M34 91 L64 35 M113 91 L143 35 M193 91 L223 35 M272 91 L302 35"/>
  </g>
  <!-- Torres de fixação, com base levemente abaixo do vidro. -->
  <g fill="#DCE2E4" stroke="#8F9AA1" stroke-width="1.25" stroke-linejoin="round">
    <rect x="56" y="97" width="9" height="29" rx="1"/>
    <rect x="135.5" y="97" width="9" height="29" rx="1"/>
    <rect x="215" y="97" width="9" height="29" rx="1"/>
    <rect x="294.5" y="97" width="9" height="29" rx="1"/>
    <rect x="53.5" y="125" width="14" height="3" rx=".6"/>
    <rect x="133" y="125" width="14" height="3" rx=".6"/>
    <rect x="212.5" y="125" width="14" height="3" rx=".6"/>
    <rect x="292" y="125" width="14" height="3" rx=".6"/>
  </g>
</svg>
